# Dockhand stack. Set GHCR_OWNER, WP_NETWORK and the WP_* vars in Dockhand's env section.
services:
  wp2docx:
    container_name: wp2docx
    image: ghcr.io/${GHCR_OWNER}/wp2docx:latest
    restart: unless-stopped
    # hardening: root only for the two capabilities needed to set owner/mode on exports
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    environment:
      WP_URL: ${WP_URL:-http://wordpress}
      PUBLIC_URL: ${PUBLIC_URL:-}
      WP_USER: ${WP_USER:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
      WP_STATUS: ${WP_STATUS:-publish}
      INTERVAL: ${INTERVAL:-3600}
      WP_FORWARDED_PROTO: ${WP_FORWARDED_PROTO:-https}
      PUID: ${PUID:-65534}
      PGID: ${PGID:-100}
      FILE_MODE: ${FILE_MODE:-0666}
      EXPORT_MODE: ${EXPORT_MODE:-mirror}
      EXCLUDE_CATEGORIES: ${EXCLUDE_CATEGORIES:-}
      EXCLUDE_TITLE_REGEX: ${EXCLUDE_TITLE_REGEX:-}
      REFERENCE_DOCX: ${REFERENCE_DOCX:-}
    volumes:
      - ${EXPORT_DIR:-/srv/exports/wordpress}:/export
    networks: [wp]
networks:
  wp:
    external: true
    name: ${WP_NETWORK:-wordpress_default}
